<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Atomic Electron Logo Animation</title>
  <style>
    html, body { margin: 0; height: 100%; background:#06070c; overflow:hidden; }
    canvas { width: 100vw; height: 100vh; display:block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>

<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: true });

  // Render size (internal)
  let W = 1080, H = 1080; // square for logo-like usage

  function resize() {
    const dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ---------- Helpers ----------
  const TAU = Math.PI * 2;
  const lerp = (a, b, t) => a + (b - a) * t;

  function glowCircle(x, y, r, color, glowColor, glowStrength=1) {
    // soft outer glow
    ctx.globalCompositeOperation = "lighter";
    ctx.beginPath();
    ctx.fillStyle = glowColor;
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = r * 1.2 * glowStrength;
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
    // crisp core
    ctx.shadowBlur = 0;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.55, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = "source-over";
  }

  function strokeGlow(pathFn, strokeStyle, glowStyle, lineWidth, glowBlur) {
    ctx.save();
    // glow pass
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = glowStyle;
    ctx.lineWidth = lineWidth;
    ctx.shadowColor = glowStyle;
    ctx.shadowBlur = glowBlur;
    pathFn();
    ctx.stroke();

    // main pass
    ctx.globalCompositeOperation = "source-over";
    ctx.shadowBlur = 0;
    ctx.strokeStyle = strokeStyle;
    ctx.lineWidth = lineWidth * 0.72;
    pathFn();
    ctx.stroke();
    ctx.restore();
  }

  // ---------- Animation params ----------
  const orbitR = { r1: 210, r2: 305 };
  const electronCount = 2;

  // Colors (neon)
  const nucColor = "#9ae6ff";
  const nucGlow  = "rgba(40, 220, 255, 0.55)";
  const eColors = [
    { core: "#9bffea", glow: "rgba(64, 255, 232, 0.75)" },
    { core: "#b2a3ff", glow: "rgba(160, 120, 255, 0.75)" },
  ];

  let t0 = performance.now();

  function drawNucleus(t) {
    const x = W/2, y = H/2;
    const pulse = 0.5 + 0.5 * Math.sin(t * 0.004);
    const r = lerp(56, 66, pulse);

    // halo ring
    strokeGlow(() => {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
    }, "rgba(155, 230, 255, 0.85)", "rgba(20, 190, 255, 0.65)", 6, 18);

    // nucleus glow + core
    glowCircle(x, y, r, nucColor, nucGlow, 1.1);
  }

  function drawOrbits(t) {
    const x = W/2, y = H/2;

    // Orbits are tilted ellipses
    const tilt = 0.75; // radians
    const cosT = Math.cos(tilt), sinT = Math.sin(tilt);

    function ellipsePath(rx, ry) {
      ctx.beginPath();
      const steps = 180;
      for (let i=0;i<=steps;i++){
        const a = (i/steps)*TAU;
        const ex = rx * Math.cos(a);
        const ey = ry * Math.sin(a);

        const px = ex;
        const py = ey * cosT;
        const persp = 1 - 0.12 * (Math.sin(a) * 0.5 + 0.5);
        ctx.lineTo(x + px * persp, y + py + (ey*sinT)*0.15);
      }
    }

    // Orbit 1
    strokeGlow(() => ellipsePath(orbitR.r1, orbitR.r1 * 0.62),
      "rgba(120, 255, 245, 0.35)", "rgba(60, 255, 232, 0.28)", 2, 10);

    // Orbit 2
    strokeGlow(() => ellipsePath(orbitR.r2, orbitR.r2 * 0.52),
      "rgba(210, 180, 255, 0.30)", "rgba(150, 110, 255, 0.26)", 2, 10);
  }

  function electronPos(t, orbitIndex) {
    const x = W/2, y = H/2;
    const speed = orbitIndex === 0 ? 0.0029 : 0.0022;
    const base = t * speed;

    const angle = base + (orbitIndex === 0 ? 0 : Math.PI/2);

    const rx = orbitIndex === 0 ? orbitR.r1 : orbitR.r2;
    const ry = orbitIndex === 0 ? orbitR.r1 * 0.62 : orbitR.r2 * 0.52;

    const tilt = 0.75;
    const cosT = Math.cos(tilt), sinT = Math.sin(tilt);

    const ex = rx * Math.cos(angle);
    const ey = ry * Math.sin(angle);

    const persp = 1 - 0.12 * (Math.sin(angle) * 0.5 + 0.5);

    const px = ex * persp;
    const py = ey * cosT + (ey*sinT)*0.15;

    return { x: x + px, y: y + py };
  }

  function drawElectrons(t) {
    const rBase = 16;
    for (let i=0;i<electronCount;i++){
      const pos = electronPos(t, i);
      const col = eColors[i];

      const wobble = 0.6 + 0.4*Math.sin(t*0.01 + i*2);
      const r = rBase * (0.85 + 0.35*wobble);

      glowCircle(pos.x, pos.y, r, col.core, col.glow, 1.0);

      // tiny trailing arc hint
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = col.glow;
      ctx.lineWidth = 2;
      ctx.shadowColor = col.glow;
      ctx.shadowBlur = 10;

      ctx.beginPath();
      ctx.arc(pos.x, pos.y, r*1.25, 0, Math.PI*0.65);
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.globalCompositeOperation = "source-over";
    }
  }

  function drawFrame(t) {
    ctx.clearRect(0,0,W,H);

    // Nucleus + fully circular rotating sub-atoms.
    drawNucleus(t);

    const x = W/2, y = H/2;

    // True octogram-ish motion: 8 evenly spaced points rotating together,
    // plus crossing phase offsets, but kept perfectly circular (no ellipse).

    function nodeOnCircle(radius, angle, size, colCore, colGlow) {
      const wob = 1 + 0.12 * Math.sin(angle*3 + t*0.01);
      const px = x + radius * Math.cos(angle);
      const py = y + radius * Math.sin(angle);
      glowCircle(px, py, size*wob, colCore, colGlow, 1.0);
    }

    function arcTrail(radius, angleCenter, span, colGlow, width=2, blur=14, alpha=1) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = colGlow;
      ctx.lineWidth = width;
      ctx.shadowColor = colGlow;
      ctx.shadowBlur = blur;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(x, y, radius, angleCenter - span/2, angleCenter + span/2);
      ctx.stroke();
      ctx.restore();
    }

    // Two counter-rotating systems to create left↔right and up↔down crossing.
    const w1 = t * 0.0024;
    const w2 = -t * 0.0019;

    const rings = [
      { r: 175, c: eColors[0].core, g: eColors[0].glow, w: w1 },
      { r: 255, c: eColors[1].core, g: eColors[1].glow, w: w2 },
      { r: 295, c: eColors[0].core, g: eColors[0].glow, w: w1 + 1.1 },
    ];

    // 8-point (octogram) distribution
    const k = 8;
    for (const ring of rings) {
      for (let i = 0; i < k; i++) {
        const base = ring.w + i * (TAU / k);
        const size = 10 + (i%2)*2;
        nodeOnCircle(ring.r, base + 0.18*Math.sin(t*0.001 + i), size, ring.c, ring.g);

        // trails for some points only (less clutter)
        if (i % 2 === 0) {
          arcTrail(ring.r, base, 0.55, ring.g, 2, 14, 0.9);
        }
      }
    }

    // Additional crossing arcs (diagonal feel) while staying circular.
    arcTrail(215, w1 + 0.7, 0.9, "rgba(64, 255, 232, 0.65)", 2, 16, 0.9);
    arcTrail(265, w2 + 2.1, 1.0, "rgba(160, 120, 255, 0.55)", 2, 16, 0.9);

    // subtle center shimmer
    const shimmer = 0.5 + 0.5*Math.sin(t*0.014);
    glowCircle(x, y, 7 + shimmer*6, "#d6fbff", "rgba(40,220,255,0.35)", 1.15);
  }

  function animate() {
    const t = performance.now() - t0;
    drawFrame(t);
    requestAnimationFrame(animate);
  }

  resize();
  window.addEventListener("resize", resize);
  animate();
})();
</script>
</body>
</html>
