<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In |Smart Exam E-Library Platform</title>
  <meta name="description" content="Sign in to your E-Library account" />
  <link rel="stylesheet" href="../../../css/auth.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%239ae6ff'/%3E%3C/svg%3E" />
</head>
<body>

  <!-- ===== BACKGROUND ===== -->
  <div class="page-bg" aria-hidden="true">
<img src="../../../assets/images/Home.png" alt="Background" />
  </div>

  <!-- ===== TOAST CONTAINER ===== -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- ===== AUTH WRAPPER ===== -->
  <div class="auth-wrapper">

    <!-- LEFT: LOGO PANEL -->
    <aside class="logo-panel" aria-label="Brand">
      <div class="logo-container">
        <canvas id="atomicCanvas"></canvas>
      </div>
      <div class="brand-text">
        <h1><b>ReVena</b></h1>
        <p>Sign In to Your Account</p>
      </div>
    </aside>

    <!-- RIGHT: FORM PANEL -->
    <main class="form-panel">
      <div class="glass-card">

        <div class="auth-header">
          <span class="auth-icon">🔐</span>
          <h2>Welcome Back</h2>
          <p>Sign in to your E-Library account</p>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" novalidate autocomplete="off">

          <!-- Email -->
          <div class="form-group">
            <label for="loginEmail">Email Address <span class="required">*</span></label>
            <input
              type="email"
              id="loginEmail"
              class="form-control"
              placeholder="tushar@example.com"
              autofocus
            />
            <div class="validation-msg"></div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="loginPassword">Password <span class="required">*</span></label>
            <div class="password-wrapper">
              <input
                type="password"
                id="loginPassword"
                class="form-control"
                placeholder="Enter your password"
                autocomplete="current-password"
              />
              <button type="button" id="togglePassword" class="password-toggle" aria-label="Toggle password visibility">👁️</button>
            </div>
            <div class="validation-msg"></div>
          </div>

          <!-- Remember + Forgot Row -->
          <div class="auth-row">
            <label class="checkbox-item" style="margin:0;">
              <input type="checkbox" id="rememberMe" checked />
              <span class="check-box"></span>
              <span class="check-label" style="font-size:0.82rem;">Remember me</span>
            </label>
            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
          </div>

          <!-- Submit -->
          <button type="submit" id="loginBtn" class="btn btn-primary" style="width:100%; justify-content:center; padding:14px;">
            Sign In →
          </button>
        </form>

        <!-- Divider -->
        <div class="divider">or continue with</div>

        <!-- Social Logins -->
        <div class="social-buttons">
          <button type="button" class="social-btn" data-provider="Google">
            <span class="social-icon"><img src="../../../assets/images/google.jpg" alt="Google" style="width:20px; height:20px; vertical-align:middle;" /></span> Google
          </button>
          <button type="button" class="social-btn" data-provider="Microsoft">
            <span class="social-icon"><img src="../../../assets/images/microsoft.jpg" alt="Microsoft" style="width:20px; height:20px; vertical-align:middle;" /></span> Microsoft
          </button>
        </div>

        <!-- Register link -->
        <div class="auth-footer">
          <p>Don't have an account? <a href="registration.html">Create Account</a></p>
        </div>

      </div>
    </main>
  </div>

  <!-- ===== SCRIPTS ===== -->
  <script src="../../../js/atomic_logo.js"></script>
  <script src="../../../js/auth.js"></script>
</body>
</html>
